<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ลอยกระทงคู่รักทางไกล 🕯️✨</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Sukhumvit Set', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #050a14;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            overflow: hidden;
        }

        /* กรอบมือถือ 9:16 */
        .mobile-frame {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            max-height: 896px;
            position: relative;
            background-image: url('พื้นหลัง.png');
            background-size: cover;
            background-position: center;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border-radius: 20px;
        }

        .overlay-dark {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(10, 15, 30, 0.3), rgba(10, 15, 30, 0.1) 40%, rgba(10, 15, 30, 0.6));
            pointer-events: none;
        }

        /* ท้องฟ้า 25% ด้านบน (โคมลอย + พลุ) */
        .sky-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 25%;
            overflow: hidden; pointer-events: none;
        }

        .lantern {
            position: absolute;
            width: 10px; height: 15px;
            background: radial-gradient(circle, #fff 20%, #ffaa00 70%, transparent 100%);
            border-radius: 4px 4px 2px 2px;
            box-shadow: 0 0 8px #ffaa00;
            opacity: 0;
            animation: floatUpSky linear infinite;
        }

        @keyframes floatUpSky {
            0% { transform: translateY(120px) scale(0.5); opacity: 0; }
            30% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-30px) scale(1); opacity: 0; }
        }

        .firework {
            position: absolute;
            width: 4px; height: 4px; border-radius: 50%;
            box-shadow: 0 0 6px #ff69b4, 0 0 12px #ff1493;
            animation: explode 2.5s ease-out infinite; opacity: 0;
        }

        @keyframes explode {
            0% { transform: scale(0.2); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.7; box-shadow: 0 0 15px #ffb6c1, 0 0 25px #ff69b4; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        /* แม่น้ำด้านล่าง 75% */
        .river-container {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 75%;
            overflow: hidden; pointer-events: none;
        }

        .water-wave {
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at bottom, rgba(40, 100, 180, 0.2) 0%, transparent 70%);
            animation: wavePulse 4s ease-in-out infinite alternate;
        }

        @keyframes wavePulse {
            0% { opacity: 0.4; transform: scaleY(1); }
            100% { opacity: 0.8; transform: scaleY(1.05); }
        }

        .bg-krathong {
            position: absolute; width: 22px; height: 22px;
            background-size: contain; background-repeat: no-repeat; background-position: center;
            opacity: 0.65; animation: driftRiver linear infinite;
        }

        @keyframes driftRiver {
            0% { transform: translateX(-20px) translateY(0px); }
            50% { transform: translateX(180px) translateY(-4px); }
            100% { transform: translateX(410px) translateY(0px); }
        }

        /* กระทงหลัก */
        .main-krathong-wrapper {
            position: absolute; bottom: 150px; left: 50%;
            transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center;
            transition: all 1s ease; z-index: 10; cursor: pointer;
        }

        .main-krathong-wrapper.floating {
            bottom: 200px;
            animation: mainFloat 3.5s ease-in-out infinite alternate;
        }

        @keyframes mainFloat {
            0% { transform: translateX(-50%) translateY(0px) rotate(-1deg); }
            100% { transform: translateX(-50%) translateY(-10px) rotate(1deg); }
        }

        /* โมเดลธูปเทียนสมจริง (พร้อมแท่งเทียน+เปลวไฟ+ธูป+ควัน) */
        .stick-container {
            position: absolute; top: 15px;
            display: flex; align-items: flex-end; gap: 8px;
            z-index: 12; touch-action: none;
        }

        .candle-body {
            width: 8px; height: 24px;
            background: linear-gradient(to right, #ffb6c1, #fff, #ffb6c1);
            border-radius: 2px 2px 0 0;
            position: relative;
            box-shadow: 0 0 5px rgba(255, 182, 193, 0.5);
        }

        .candle-wick {
            position: absolute; top: -4px; left: 3.5px;
            width: 1px; height: 4px; background: #333;
        }

        .candle-flame {
            position: absolute; top: -14px; left: 0px;
            width: 9px; height: 14px;
            background: radial-gradient(circle, #fff 10%, #ffeb3b 50%, #ff3d00 100%);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 10px #ffbb00, 0 0 20px #ff3d00;
            animation: flicker 0.15s infinite alternate;
        }

        @keyframes flicker {
            0% { transform: scale(1) rotate(-2deg); opacity: 0.9; }
            100% { transform: scale(1.15) rotate(2deg); opacity: 1; }
        }

        .incense-group {
            display: flex; gap: 3px; align-items: flex-end;
        }

        .incense-stick {
            width: 2px; height: 26px; background: #7a4b1e; position: relative;
        }

        .incense-smoke {
            position: absolute; top: -10px; left: -3px;
            width: 8px; height: 14px; background: rgba(255, 255, 255, 0.5);
            filter: blur(2px); border-radius: 50%;
            animation: smokeRise 2s infinite ease-out;
        }

        @keyframes smokeRise {
            0% { transform: translateY(0) scale(0.5); opacity: 0.8; }
            100% { transform: translateY(-18px) scale(1.8); opacity: 0; }
        }

        .krathong-img {
            width: 165px; height: 135px; object-fit: contain;
            filter: drop-shadow(0 8px 15px rgba(0, 0, 0, 0.6));
        }

        .tag-label {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ff69b4; color: #d81b60;
            padding: 3px 14px; border-radius: 12px;
            font-size: 11px; font-weight: bold; margin-top: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3); display: none;
        }

        /* แท็บล่างสุดสีขาว-ชมพู */
        .bottom-panel {
            position: absolute; bottom: 12px; left: 12px; right: 12px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 182, 193, 0.8);
            border-radius: 16px; padding: 10px 14px;
            z-index: 20; box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            transition: transform 0.4s ease;
        }

        .panel-title {
            font-size: 11px; color: #d81b60; text-align: center;
            margin-bottom: 6px; font-weight: bold;
        }

        .krathong-selector {
            display: flex; gap: 8px; overflow-x: auto;
            padding-bottom: 4px; margin-bottom: 8px; scrollbar-width: none;
        }

        .krathong-selector::-webkit-scrollbar { display: none; }

        .item-card {
            flex: 0 0 auto; width: 48px; height: 48px; background: #fff;
            border: 2px solid #ffd1dc; border-radius: 10px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.2s;
        }

        .item-card.active {
            border-color: #ff69b4; background: #fff0f5; transform: scale(1.05);
        }

        .item-card img { width: 80%; height: 80%; object-fit: contain; }

        .photos-input-list {
            display: flex; flex-direction: column; gap: 6px;
            max-height: 140px; overflow-y: auto; margin-bottom: 8px;
            padding-right: 4px;
        }

        .input-row { display: flex; gap: 6px; align-items: center; }

        input[type="text"], textarea {
            width: 100%; background: #fff; border: 1px solid #ffb6c1;
            border-radius: 8px; padding: 6px 8px; color: #333;
            font-size: 11px; outline: none;
        }

        input[type="file"] { display: none; }

        .upload-btn {
            background: #fff0f5; border: 1px dashed #ff69b4; color: #d81b60;
            padding: 5px 8px; border-radius: 8px; font-size: 10px;
            cursor: pointer; text-align: center; width: 85px; font-weight: bold;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .btn-primary {
            width: 100%; background: linear-gradient(135deg, #ff69b4, #ff1493);
            border: none; color: #fff; padding: 9px; border-radius: 10px;
            font-size: 12px; font-weight: bold; cursor: pointer;
            box-shadow: 0 3px 10px rgba(255, 20, 147, 0.3);
        }

        /* ปุ่มลอยกระทงแบบเดี่ยว ลอยเด่นสวยงาม */
        .floating-launch-btn {
            position: absolute; bottom: 30px; left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            color: #fff; border: 2px solid #fff; padding: 12px 28px;
            border-radius: 25px; font-size: 14px; font-weight: bold;
            cursor: pointer; box-shadow: 0 6px 20px rgba(255, 20, 147, 0.5);
            z-index: 30; display: none; text-shadow: 0 1px 3px rgba(0,0,0,0.3);
            animation: pulseBtn 1.8s infinite;
        }

        @keyframes pulseBtn {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
            100% { transform: translateX(-50%) scale(1); }
        }

        /* ระบบกระจายรูปโพลารอยด์ความทรงจำเมื่อกดกระทง */
        .memory-overlay {
            position: absolute; inset: 0;
            background: rgba(5, 10, 20, 0.85); backdrop-filter: blur(8px);
            z-index: 100; display: none; flex-direction: column;
            justify-content: center; align-items: center; padding: 20px;
        }

        .memory-title {
            color: #ffb6c1; font-size: 16px; font-weight: bold;
            margin-bottom: 5px; text-shadow: 0 0 10px #ff69b4;
        }

        .memory-wish-text {
            color: #fff; font-size: 11px; text-align: center;
            max-width: 80%; margin-bottom: 15px; opacity: 0.9;
            font-style: italic; background: rgba(255,255,255,0.1);
            padding: 6px 14px; border-radius: 12px;
        }

        /* การกระจายการ์ดโพลารอยด์ */
        .polaroid-scatter-container {
            position: relative; width: 100%; height: 380px;
            display: flex; justify-content: center; align-items: center;
        }

        .polaroid-card {
            position: absolute; background: #ffffff; padding: 8px 8px 16px 8px;
            border-radius: 4px; box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            width: 110px; cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: scatterIn 0.6s ease-out forwards;
        }

        .polaroid-card:hover {
            transform: scale(1.15) rotate(0deg) !important; z-index: 50 !important;
        }

        .polaroid-card img {
            width: 100%; height: 95px; object-fit: cover; border-radius: 2px; background: #eee;
        }

        .polaroid-card p {
            font-size: 9px; color: #333; margin-top: 6px; font-weight: bold;
            text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        @keyframes scatterIn {
            0% { transform: scale(0) translate(0, 0); opacity: 0; }
            100% { opacity: 1; }
        }

        /* ป๊อปอัปขยายภาพโพลารอยด์เต็มจอ */
        .full-photo-modal {
            position: absolute; inset: 0; background: rgba(0,0,0,0.92);
            z-index: 150; display: none; flex-direction: column;
            justify-content: center; align-items: center; padding: 20px;
        }

        .polaroid-frame-large {
            background: #ffffff; padding: 12px 12px 24px 12px;
            border-radius: 6px; box-shadow: 0 10px 30px rgba(255,255,255,0.2);
            max-width: 85%; width: 290px; text-align: center;
            animation: popLarge 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popLarge {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .polaroid-frame-large img {
            width: 100%; height: 220px; object-fit: cover; border-radius: 4px;
        }

        .polaroid-frame-large p {
            color: #222; font-size: 13px; font-weight: bold; margin-top: 10px;
        }

        .close-btn {
            position: absolute; top: 15px; right: 15px;
            background: rgba(255,255,255,0.2); color: #fff; border: none;
            width: 32px; height: 32px; border-radius: 50%; font-weight: bold;
            font-size: 16px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="mobile-frame" id="frame">
        <div class="overlay-dark"></div>

        <!-- ท้องฟ้าด้านบน 25% -->
        <div class="sky-container" id="sky"></div>

        <!-- แม่น้ำด้านล่าง 75% -->
        <div class="river-container" id="river">
            <div class="water-wave"></div>
        </div>

        <!-- กระทงหลัก -->
        <div class="main-krathong-wrapper" id="mainKrathong" onclick="openMemoryModal()">
            <!-- ธูปเทียนที่เตรียมไว้ให้ลาก -->
            <div class="stick-container" id="dragSticks" style="top: 15px;">
                <div class="candle-body">
                    <div class="candle-wick"></div>
                    <div class="candle-flame"></div>
                </div>
                <div class="incense-group">
                    <div class="incense-stick"><div class="incense-smoke"></div></div>
                    <div class="incense-stick"><div class="incense-smoke"></div></div>
                    <div class="incense-stick"><div class="incense-smoke"></div></div>
                </div>
            </div>

            <img id="krathongDisplay" class="krathong-img" src="กระทง1.png" alt="กระทง" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3501/3501140.png'">
            
            <div class="tag-label" id="tagLabel">me</div>
        </div>

        <!-- ปุ่มลอยกระทงเดี่ยวๆ ที่ปรากฏหลังปักธูปเทียนเสร็จ -->
        <button class="floating-launch-btn" id="launchBtn" onclick="launchKrathong()">พร้อมลอยกระทงร่วมกัน ✨</button>

        <!-- แท็บควบคุมล่างสุด (สีขาว-ชมพู) -->
        <div class="bottom-panel" id="bottomPanel">
            
            <!-- สเต็ป 1: เลือกกระทง -->
            <div id="step1Content">
                <div class="panel-title">เลือกกระทงสวยๆ 🌸</div>
                <div class="krathong-selector" id="selector"></div>
                <button class="btn-primary" onclick="goToStep(2)">ถัดไป: ใส่รูปความทรงจำ (5 รูป) 📸</button>
            </div>

            <!-- สเต็ป 2: อัปโหลดรูปความทรงจำ 5 รูป -->
            <div id="step2Content" style="display: none;">
                <div class="panel-title">อัปโหลดรูปภาพความทรงจำ 5 รูป 💕</div>
                <div class="photos-input-list" id="photosInputList"></div>
                <button class="btn-primary" onclick="goToStep(3)">ถัดไป: คำอธิษฐาน ✨</button>
            </div>

            <!-- สเต็ป 3: พิมพ์คำอธิษฐาน -->
            <div id="step3Content" style="display: none;">
                <div class="panel-title">เขียนคำอธิษฐานของเราสองคน 💌</div>
                <div class="form-group">
                    <textarea id="wishInput" rows="2" placeholder="พิมพ์คำอธิษฐานที่นี่..."></textarea>
                </div>
                <button class="btn-primary" onclick="finishWish()">พิมพ์คำอธิษฐานเสร็จสิ้น 🕯️</button>
            </div>

        </div>

        <!-- หน้าจอความทรงจำโพลารอยด์กระจายเมื่อกดกระทง -->
        <div class="memory-overlay" id="memoryOverlay">
            <button class="close-btn" onclick="closeMemoryModal()">✕</button>
            <div class="memory-title">ความทรงจำของเรา ❤️</div>
            <div class="memory-wish-text" id="displayWishText">"ขอให้เรามีความสุข รักกันนานๆ..."</div>
            
            <div class="polaroid-scatter-container" id="scatterContainer">
                <!-- การ์ดโพลารอยด์ 5 ใบจะสร้างผ่าน JS -->
            </div>
        </div>

        <!-- ป๊อปอัปขยายโพลารอยด์ขยายใหญ่เต็มจอ -->
        <div class="full-photo-modal" id="fullPhotoModal">
            <button class="close-btn" onclick="closeFullPhoto()">✕</button>
            <div class="polaroid-frame-large">
                <img id="fullImg" src="" alt="รูปโพลารอยด์">
                <p id="fullCaption"></p>
            </div>
        </div>

    </div>

    <script>
        const photoDataList = Array(5).fill(null).map(() => ({ src: '', caption: '' }));

        // 1. โคมลอย + พลุ
        const sky = document.getElementById('sky');
        for (let i = 0; i < 10; i++) {
            const lantern = document.createElement('div');
            lantern.className = 'lantern';
            lantern.style.left = `${Math.random() * 90}%`;
            lantern.style.animationDuration = `${6 + Math.random() * 6}s`;
            lantern.style.animationDelay = `${Math.random() * 4}s`;
            sky.appendChild(lantern);
        }

        for (let i = 0; i < 3; i++) {
            const fw = document.createElement('div');
            fw.className = 'firework';
            fw.style.left = `${15 + Math.random() * 70}%`;
            fw.style.top = `${5 + Math.random() * 15}%`;
            fw.style.animationDuration = `${2 + Math.random() * 2}s`;
            fw.style.animationDelay = `${Math.random() * 3}s`;
            sky.appendChild(fw);
        }

        // 2. กระทงลอยไกลๆ
        const river = document.getElementById('river');
        for (let i = 0; i < 5; i++) {
            const bgKrathong = document.createElement('div');
            bgKrathong.className = 'bg-krathong';
            bgKrathong.style.backgroundImage = `url('กระทง${(i % 9) + 1}.png')`;
            bgKrathong.style.top = `${15 + Math.random() * 65}%`;
            bgKrathong.style.animationDuration = `${10 + Math.random() * 8}s`;
            bgKrathong.style.animationDelay = `${Math.random() * 6}s`;
            river.appendChild(bgKrathong);
        }

        // 3. สร้างแถบเลือกกระทง 9 แบบ
        const selector = document.getElementById('selector');
        for (let i = 1; i <= 9; i++) {
            const card = document.createElement('div');
            card.className = `item-card ${i === 1 ? 'active' : ''}`;
            card.onclick = () => selectKrathong(i, card);
            const img = document.createElement('img');
            img.src = `กระทง${i}.png`;
            img.onerror = () => { img.src = 'https://cdn-icons-png.flaticon.com/512/3501/3501140.png'; };
            card.appendChild(img); selector.appendChild(card);
        }

        function selectKrathong(index, cardEl) {
            document.querySelectorAll('.item-card').forEach(el => el.classList.remove('active'));
            cardEl.classList.add('active');
            document.getElementById('krathongDisplay').src = `กระทง${index}.png`;
        }

        // 4. สร้างช่องอัปโหลดรูป 5 รูป
        const photosInputList = document.getElementById('photosInputList');
        for (let i = 0; i < 5; i++) {
            const row = document.createElement('div');
            row.className = 'input-row';
            row.innerHTML = `
                <label class="upload-btn" id="upBtn${i}">📷 รูปที่ ${i + 1}
                    <input type="file" accept="image/*" onchange="uploadPhoto(event, ${i})">
                </label>
                <input type="text" placeholder="ข้อความใต้รูปที่ ${i + 1}" oninput="photoDataList[${i}].caption = this.value">
            `;
            photosInputList.appendChild(row);
        }

        function uploadPhoto(event, index) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    photoDataList[index].src = e.target.result;
                    document.getElementById(`upBtn${index}`).style.background = '#e8f5e9';
                    document.getElementById(`upBtn${index}`).style.color = '#2e7d32';
                    document.getElementById(`upBtn${index}`).innerText = `✓ รูปที่ ${index + 1}`;
                }
                reader.readAsDataURL(file);
            }
        }

        function goToStep(step) {
            document.getElementById('step1Content').style.display = step === 1 ? 'block' : 'none';
            document.getElementById('step2Content').style.display = step === 2 ? 'block' : 'none';
            document.getElementById('step3Content').style.display = step === 3 ? 'block' : 'none';
        }

        // 5. พิมพ์คำอธิษฐานเสร็จสิ้น -> เปิดระบบลากธูปเทียนบนกระทงโดยตรง
        function finishWish() {
            // ซ่อนแท็บล่างสุดทันที
            document.getElementById('bottomPanel').style.transform = 'translateY(150%)';
            initDirectDragSticks();
        }

        // 6. ระบบลากธูปเทียนบนกระทง (ไม่มีแถบกั้น จับสะดวก)
        function initDirectDragSticks() {
            const dragEl = document.getElementById('dragSticks');
            let isDragging = false;

            function startDrag(e) {
                isDragging = true;
                e.stopPropagation();
            }

            function moveDrag(e) {
                if (!isDragging) return;
                const touch = e.touches ? e.touches[0] : e;
                const krathongRect = document.getElementById('mainKrathong').getBoundingClientRect();
                
                // ให้ลากธูปเทียนขยับตามนิ้วมือ
                let newLeft = touch.clientX - krathongRect.left - 20;
                let newTop = touch.clientY - krathongRect.top - 20;

                dragEl.style.left = `${newLeft}px`;
                dragEl.style.top = `${newTop}px`;
            }

            function endDrag() {
                if (!isDragging) return;
                isDragging = false;
                // ปักธูปเทียนเสร็จ -> แสดงปุ่มลอยกระทงเดี่ยวๆ
                document.getElementById('launchBtn').style.display = 'block';
            }

            dragEl.addEventListener('touchstart', startDrag);
            document.addEventListener('touchmove', moveDrag);
            document.addEventListener('touchend', endDrag);

            dragEl.addEventListener('mousedown', startDrag);
            document.addEventListener('mousemove', moveDrag);
            document.addEventListener('mouseup', endDrag);
        }

        // 7. ลอยกระทงร่วมกัน
        function launchKrathong() {
            document.getElementById('launchBtn').style.display = 'none';
            document.getElementById('tagLabel').style.display = 'inline-block';
            document.getElementById('mainKrathong').classList.add('floating');
        }

        // 8. แสดงภาพโพลารอยด์กระจายตัวอย่างทันสมัยเมื่อกดกระทง
        function openMemoryModal() {
            if (document.getElementById('mainKrathong').classList.contains('floating')) {
                const wish = document.getElementById('wishInput').value;
                document.getElementById('displayWishText').innerText = wish.trim() !== "" ? `“ ${wish} ”` : "“ ขอให้เรามีความสุข รักกันนานๆ ❤️ ”";
                
                const scatterContainer = document.getElementById('scatterContainer');
                scatterContainer.innerHTML = '';

                // ค่าองศาและตำแหน่งกระจายตัว 5 จุด
                const transforms = [
                    { x: -90, y: -80, r: -12 },
                    { x: 80, y: -70, r: 10 },
                    { x: 0, y: 10, r: -3 },
                    { x: -85, y: 100, r: 8 },
                    { x: 85, y: 90, r: -15 }
                ];

                photoDataList.forEach((data, i) => {
                    const card = document.createElement('div');
                    card.className = 'polaroid-card';
                    const pos = transforms[i];
                    card.style.transform = `translate(${pos.x}px, ${pos.y}px) rotate(${pos.r}deg)`;
                    card.style.animationDelay = `${i * 0.1}s`;
                    card.onclick = (e) => { e.stopPropagation(); openFullPhoto(data, i); };

                    const imgSrc = data.src || 'https://via.placeholder.com/150/ffb6c1/ffffff?text=Love';
                    const capText = data.caption || `ความทรงจำที่ ${i + 1}`;

                    card.innerHTML = `<img src="${imgSrc}"><p>${capText}</p>`;
                    scatterContainer.appendChild(card);
                });

                document.getElementById('memoryOverlay').style.display = 'flex';
            }
        }

        function closeMemoryModal() {
            document.getElementById('memoryOverlay').style.display = 'none';
        }

        // 9. ป๊อปอัปโพลารอยด์ขยายใหญ่เต็มจอ
        function openFullPhoto(data, index) {
            const imgSrc = data.src || 'https://via.placeholder.com/300/ffb6c1/ffffff?text=Love';
            const capText = data.caption || `ความทรงจำที่ ${index + 1}`;
            
            document.getElementById('fullImg').src = imgSrc;
            document.getElementById('fullCaption').innerText = capText;
            document.getElementById('fullPhotoModal').style.display = 'flex';
        }

        function closeFullPhoto() {
            document.getElementById('fullPhotoModal').style.display = 'none';
        }
    </script>
</body>
</html>
