<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ลอยกระทงเพื่อเธอคนพิเศษ 🕯️✨</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none; -webkit-user-select: none;
            font-family: 'Sukhumvit Set', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #050a14;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; color: #ffffff; overflow: hidden;
        }

        .mobile-frame {
            width: 100%; max-width: 414px; height: 100vh; max-height: 896px;
            position: relative; background-image: url('พื้นหลัง.png');
            background-size: cover; background-position: center;
            overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border-radius: 20px;
        }

        .overlay-dark {
            position: absolute; inset: 0;
            background: linear-gradient(to bottom, rgba(10, 15, 30, 0.2), rgba(10, 15, 30, 0.05) 40%, rgba(10, 15, 30, 0.5));
            pointer-events: none;
        }

        .sky-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 25%;
            overflow: hidden; pointer-events: none;
        }

        .lantern {
            position: absolute; width: 10px; height: 15px;
            background: radial-gradient(circle, #fff 20%, #ffaa00 70%, transparent 100%);
            border-radius: 4px 4px 2px 2px; box-shadow: 0 0 8px #ffaa00;
            opacity: 0; animation: floatUpSky linear infinite;
        }

        @keyframes floatUpSky {
            0% { transform: translateY(120px) scale(0.5); opacity: 0; }
            30% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-30px) scale(1); opacity: 0; }
        }

        .river-container {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 75%;
            overflow: hidden; pointer-events: none;
        }

        .water-wave {
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at bottom, rgba(40, 100, 180, 0.2) 0%, transparent 70%);
            animation: wavePulse 4s ease-in-out infinite alternate;
        }

        @keyframes wavePulse {
            0% { opacity: 0.4; transform: scaleY(1); }
            100% { opacity: 0.8; transform: scaleY(1.05); }
        }

        .bg-krathong {
            position: absolute; width: 22px; height: 22px;
            background-size: contain; background-repeat: no-repeat; background-position: center;
            opacity: 0; animation: driftRightRiver linear infinite;
        }

        @keyframes driftRightRiver {
            0% { transform: translate(var(--start-x), var(--start-y)) scale(0.6); opacity: 0; }
            15% { opacity: 0.7; }
            85% { opacity: 0.7; }
            100% { transform: translate(var(--end-x), var(--end-y)) scale(1.1); opacity: 0; }
        }

        /* กระทงหลักที่ลอยอยู่กลางจอ */
        .main-krathong-wrapper {
            position: absolute; bottom: 220px; left: 50%;
            transform: translateX(-50%); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10; cursor: pointer;
            width: 170px; animation: mainFloat 3.5s ease-in-out infinite alternate;
        }

        @keyframes mainFloat {
            0% { transform: translateX(-50%) translateY(0px) rotate(-1deg); }
            100% { transform: translateX(-50%) translateY(-10px) rotate(1deg); }
        }

        .krathong-img {
            width: 170px; height: 140px; object-fit: contain;
            filter: drop-shadow(0 8px 15px rgba(0, 0, 0, 0.6));
            margin: 0 auto; display: block;
        }

        .tag-label {
            background: rgba(255, 255, 255, 0.9); border: 1px solid #ff69b4; color: #d81b60;
            padding: 3px 14px; border-radius: 12px; font-size: 11px; font-weight: bold; margin-top: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        /* ธูปเทียนที่ปักไว้แล้วเพื่อความสวยงาม */
        .stick-container {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; z-index: 50; pointer-events: none;
        }

        .sticks-row { display: flex; align-items: flex-end; gap: 6px; }

        .candle-body {
            width: 8px; height: 24px;
            background: linear-gradient(to right, #ffc0cb, #ffffff, #ffb6c1);
            border-radius: 3px 3px 0 0; position: relative;
        }

        .candle-wick { position: absolute; top: -3px; left: 3px; width: 1px; height: 3px; background: #333; }
        .candle-flame {
            position: absolute; top: -12px; left: -1px; width: 8px; height: 12px;
            background: radial-gradient(circle, #fff 10%, #ffeb3b 50%, #ff3d00 100%);
            border-radius: 50% 50% 20% 20%; box-shadow: 0 0 8px #ffbb00;
            animation: flicker 0.15s infinite alternate;
        }

        @keyframes flicker {
            0% { transform: scale(1); opacity: 0.9; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        .incense-group { display: flex; gap: 2px; align-items: flex-end; }
        .incense-stick { width: 2px; height: 25px; background: #7a4b1e; position: relative; }
        .incense-smoke {
            position: absolute; top: -8px; left: -2px; width: 6px; height: 12px;
            background: rgba(255, 255, 255, 0.5); filter: blur(2px); border-radius: 50%;
            animation: smokeRise 2s infinite ease-out;
        }

        @keyframes smokeRise {
            0% { transform: translateY(0) scale(0.5); opacity: 0.8; }
            100% { transform: translateY(-15px) scale(1.8); opacity: 0; }
        }

        .drag-hint-fixed {
            position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
            color: #ffb6c1; font-size: 13px; font-weight: bold; text-shadow: 0 1px 5px rgba(0,0,0,0.8);
            white-space: nowrap; z-index: 45; pointer-events: none; animation: pulseText 1.5s infinite;
        }

        @keyframes pulseText { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }

        /* หน้าจอแสดงคำอธิษฐานและรูปโพลารอยด์ */
        .memory-overlay {
            position: absolute; inset: 0; background-image: url('พื้นหลัง.png');
            background-size: cover; background-position: center; backdrop-filter: blur(12px);
            z-index: 100; display: none; flex-direction: column; justify-content: center;
            align-items: center; padding: 20px; opacity: 0; transform: scale(0.92);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .memory-overlay::before { content: ''; position: absolute; inset: 0; background: rgba(10, 15, 30, 0.55); pointer-events: none; }
        .memory-overlay.show { opacity: 1; transform: scale(1); }

        .memory-title { position: relative; color: #ffb6c1; font-size: 18px; font-weight: bold; margin-bottom: 6px; text-shadow: 0 0 12px #ff69b4; z-index: 2; }
        .memory-wish-text { position: relative; color: #fff; font-size: 12px; text-align: center; max-width: 85%; margin-bottom: 15px; opacity: 0.95; background: rgba(255,255,255,0.15); padding: 8px 16px; border-radius: 12px; z-index: 2; }

        .polaroid-scatter-container { position: relative; width: 100%; height: 380px; display: flex; justify-content: center; align-items: center; z-index: 2; }

        .polaroid-card {
            position: absolute; background: #ffffff; padding: 8px 8px 14px 8px;
            border-radius: 4px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 110px; cursor: pointer;
            opacity: 0; transform: translate(0, 100px) scale(0.2) rotate(0deg);
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            transition-delay: var(--delay);
        }

        .polaroid-card.show {
            opacity: 1; transform: translate(var(--dest-x), var(--dest-y)) scale(1) rotate(var(--rot));
            animation: cardWiggle 2.5s ease-in-out infinite; animation-delay: calc(var(--delay) + 1.2s);
        }

        @keyframes cardWiggle {
            0%, 100% { transform: translate(var(--dest-x), var(--dest-y)) scale(1) rotate(var(--rot)); }
            25% { transform: translate(var(--dest-x), calc(var(--dest-y) - 6px)) scale(1.04) rotate(calc(var(--rot) + 3deg)); }
            75% { transform: translate(var(--dest-x), calc(var(--dest-y) + 4px)) scale(0.98) rotate(calc(var(--rot) - 3deg)); }
        }

        .polaroid-card img { width: 100%; height: 90px; object-fit: cover; border-radius: 2px; background: #eee; }
        .polaroid-card p { font-size: 14px; color: #d81b60; margin-top: 5px; font-weight: bold; text-align: center; }

        .full-photo-modal {
            position: absolute; inset: 0; background: rgba(5, 10, 20, 0.65);
            backdrop-filter: blur(8px); z-index: 150; display: none; flex-direction: column;
            justify-content: center; align-items: center; padding: 20px; opacity: 0; transform: scale(0.85);
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .full-photo-modal.show { opacity: 1; transform: scale(1); }
        .polaroid-frame-large { background: #ffffff; padding: 12px 12px 24px 12px; border-radius: 8px; max-width: 85%; width: 290px; text-align: center; }
        .polaroid-frame-large img { width: 100%; height: 220px; object-fit: cover; border-radius: 4px; }
        .polaroid-frame-large p { color: #222; font-size: 13px; font-weight: bold; margin-top: 10px; }

        .close-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.25); color: #fff; border: none; width: 32px; height: 32px; border-radius: 50%; font-weight: bold; font-size: 16px; cursor: pointer; z-index: 10; }
        
        .floating-heart {
            position: absolute; bottom: -30px; font-size: 22px; opacity: 0;
            animation: floatHeartUltraSlow 6.5s cubic-bezier(0.2, 0.8, 0.4, 1) forwards;
            pointer-events: none; z-index: 200;
        }

        @keyframes floatHeartUltraSlow {
            0% { transform: translateY(0) scale(0.3); opacity: 0; }
            15% { opacity: 0.95; } 85% { opacity: 0.8; }
            100% { transform: translateY(-620px) scale(1.3); opacity: 0; }
        }
    </style>
</head>
<body>

    <audio id="bgMusic" src="song.mp3" loop></audio>

    <div class="mobile-frame" id="frame">
        <div class="overlay-dark"></div>
        <div class="sky-container" id="sky"></div>
        <div class="river-container" id="river"><div class="water-wave"></div></div>

        <div class="drag-hint-fixed">✨ แตะที่กระทงเพื่อดูความทรงจำของเรา ❤️</div>

        <!-- กระทงหลัก -->
        <div class="main-krathong-wrapper" onclick="openMemoryModal()">
            <img class="krathong-img" src="กระทง1.png" alt="กระทง" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3501/3501140.png'">
            <div class="tag-label">For You 💖</div>
            
            <!-- ธูปเทียนปักไว้สำเร็จ -->
            <div class="stick-container">
                <div class="sticks-row">
                    <div class="candle-body"><div class="candle-wick"></div><div class="candle-flame"></div></div>
                    <div class="incense-group">
                        <div class="incense-stick"><div class="incense-smoke"></div></div>
                        <div class="incense-stick"><div class="incense-smoke"></div></div>
                        <div class="incense-stick"><div class="incense-smoke"></div></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- หน้าจอความทรงจำ (โชว์รูปและข้อความของคุณให้แฟนดู) -->
        <div class="memory-overlay" id="memoryOverlay">
            <button class="close-btn" onclick="closeMemoryModal()">✕</button>
            <div class="memory-title">คำอธิษฐานของเรา ❤️</div>
            <div class="memory-wish-text" id="displayWishText">"ขอให้เรามีความสุข รักกันนานๆ ตลอดไปนะบี๋"</div>
            <div class="polaroid-scatter-container" id="scatterContainer"></div>
        </div>

        <!-- ป๊อปอัปรูปใหญ่ -->
        <div class="full-photo-modal" id="fullPhotoModal" onclick="closeFullPhoto()">
            <button class="close-btn" onclick="closeFullPhoto()">✕</button>
            <div class="polaroid-frame-large" onclick="event.stopPropagation()">
                <img id="fullImg" src="" alt="รูปโพลารอยด์" onclick="closeFullPhoto()">
                <p id="fullCaption"></p>
            </div>
        </div>

    </div>

    <script>
        // ==========================================================
        // 💌 เติมข้อมูลของคุณตรงนี้ได้เลย (รูปภาพ 5 รูป + ข้อความ + คำอธิษฐาน)
        // ==========================================================
        const myWishMessage = "“ ขอให้เรามีความสุข เดินทางปลอดภัย และรักกันแบบนี้ทุกวันเลยนะ ❤️ ”";

        const myPhotos = [
            { src: 'รูปที่1.jpg', caption: 'วันแรกที่เราไปเที่ยวด้วยกัน 🌸' },
            { src: 'รูปที่2.jpg', caption: 'รอยยิ้มที่ชอบที่สุด 🥰' },
            { src: 'รูปที่3.jpg', caption: 'ขอบคุณที่คอยดูแลกันนะ 💕' },
            { src: 'รูปที่4.jpg', caption: 'โมเมนต์น่ารักๆ ของเรา ✨' },
            { src: 'รูปที่5.jpg', caption: 'รักอ้วนที่สุดเลยน้า 💖' }
        ];
        // ==========================================================

        // เล่นเพลงพื้นหลังเมื่อผู้ใช้แตะหน้าจอ
        document.body.addEventListener('click', () => {
            const audio = document.getElementById('bgMusic');
            audio.play().catch(e => console.log("Audio play blocked:", e));
        }, { once: true });

        // ท้องฟ้า
        const sky = document.getElementById('sky');
        for (let i = 0; i < 10; i++) {
            const lantern = document.createElement('div');
            lantern.className = 'lantern';
            lantern.style.left = `${Math.random() * 90}%`;
            lantern.style.animationDuration = `${6 + Math.random() * 6}s`;
            lantern.style.animationDelay = `${Math.random() * 4}s`;
            sky.appendChild(lantern);
        }

        // แม่น้ำ
        const river = document.getElementById('river');
        for (let i = 0; i < 6; i++) {
            const bgKrathong = document.createElement('div');
            bgKrathong.className = 'bg-krathong';
            bgKrathong.style.backgroundImage = `url('กระทง${(i % 9) + 1}.png')`;
            const startX = -60 - (i * 35);
            const startY = 60 + Math.random() * 280;
            bgKrathong.style.setProperty('--start-x', `${startX}px`);
            bgKrathong.style.setProperty('--start-y', `${startY}px`);
            bgKrathong.style.setProperty('--end-x', `${startX + 480}px`);
            bgKrathong.style.setProperty('--end-y', `${startY}px`);
            bgKrathong.style.animationDuration = `${11 + Math.random() * 5}s`;
            bgKrathong.style.animationDelay = `${i * 2.2}s`;
            river.appendChild(bgKrathong);
        }

        // เปิดหน้าจอความทรงจำ
        function openMemoryModal() {
            document.getElementById('displayWishText').innerText = myWishMessage;
            
            const scatterContainer = document.getElementById('scatterContainer');
            scatterContainer.innerHTML = '';

            const scatterPositions = [
                { x: -115, y: -70, r: -8, delay: 0.1 },
                { x: 110, y: -80, r: 12, delay: 0.25 },
                { x: -120, y: 50, r: 6, delay: 0.4 },
                { x: 125, y: 60, r: -14, delay: 0.55 },
                { x: 0, y: -15, r: 3, delay: 0.7 }
            ];

            myPhotos.forEach((data, i) => {
                const card = document.createElement('div');
                card.className = 'polaroid-card';
                const pos = scatterPositions[i];
                card.style.setProperty('--dest-x', `${pos.x}px`);
                card.style.setProperty('--dest-y', `${pos.y}px`);
                card.style.setProperty('--rot', `${pos.r}deg`);
                card.style.setProperty('--delay', `${pos.delay}s`);
                card.onclick = (e) => { e.stopPropagation(); openFullPhoto(data); };

                const imgSrc = data.src || 'https://via.placeholder.com/150/ffb6c1/ffffff?text=Love';
                card.innerHTML = `<img src="${imgSrc}"><p>?</p>`;
                scatterContainer.appendChild(card);
                setTimeout(() => card.classList.add('show'), 50);
            });

            const overlay = document.getElementById('memoryOverlay');
            overlay.style.display = 'flex';
            setTimeout(() => overlay.classList.add('show'), 10);
        }

        function closeMemoryModal() {
            const overlay = document.getElementById('memoryOverlay');
            overlay.classList.remove('show');
            setTimeout(() => overlay.style.display = 'none', 600);
        }

        function openFullPhoto(data) {
            document.getElementById('fullImg').src = data.src || 'https://via.placeholder.com/300/ffb6c1/ffffff?text=Love';
            document.getElementById('fullCaption').innerText = data.caption || 'ความทรงจำของเรา';
            const modal = document.getElementById('fullPhotoModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
            createFloatingHearts();
        }

        function closeFullPhoto() {
            const modal = document.getElementById('fullPhotoModal');
            modal.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 400);
        }

        function createFloatingHearts() {
            const emojis = ['❤️', '💖', '✨', '💕', '🌹', '✨', '💗', '🥰'];
            const frame = document.getElementById('frame');
            for (let i = 0; i < 8; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                heart.style.left = `${15 + Math.random() * 70}%`;
                heart.style.animationDuration = `${6 + Math.random() * 2}s`;
                heart.style.animationDelay = `${Math.random() * 0.6}s`;
                frame.appendChild(heart);
                setTimeout(() => heart.remove(), 8000);
            }
        }
    </script>
</body>
</html>
